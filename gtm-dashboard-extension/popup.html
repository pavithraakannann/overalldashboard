<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Dashboard Auto-Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }

        .content {
            padding: 20px;
            background: white;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .status-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 12px;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #666;
        }

        .status-value {
            font-weight: 600;
            color: #333;
        }

        .status-value.success {
            color: #28a745;
        }

        .status-value.pending {
            color: #ffc107;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .toggle-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .file-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .file-item {
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item.complete {
            border-left: 3px solid #28a745;
        }

        .file-item.pending {
            border-left: 3px solid #ffc107;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            padding: 15px 20px;
            background: #f8f9fa;
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌳 GTM Dashboard Auto-Loader</h1>
        <p>Automatically sync data from Green Tamil Mission</p>
    </div>

    <div class="content">
        <div class="status-card">
            <h3>📊 Status</h3>
            <div class="status-item">
                <span class="status-label">Downloaded Files:</span>
                <span class="status-value" id="downloadedCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Processing Queue:</span>
                <span class="status-value" id="queueCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Last Updated:</span>
                <span class="status-value" id="lastUpdated">Never</span>
            </div>
        </div>

        <div class="file-list" id="fileList">
            <!-- Files will be listed here -->
        </div>

        <div class="button-group">
            <button class="btn-primary" id="extractBtn">
                📥 Extract Data from Current Page
            </button>
            <button class="btn-success" id="mergeBtn">
                🔀 Merge & Download CSV
            </button>
            <button class="btn-secondary" id="updateDashboardBtn">
                🔄 Update Dashboard
            </button>
        </div>

        <div class="toggle-section">
            <div class="toggle-label">
                <span>Auto-export on page load</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoExportToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="footer">
        Green Tamil Mission Dashboard Integration
    </div>

    <script src="popup.js"></script>
</body>
</html>
